<div *ngIf="users.length > 0" class="users-container">
  <div class="user-card" *ngFor="let driver of users">
    <div class="card card-user">

      <!-- BOTONES -->
      <div class="card-actions">
        <button mat-icon-button *ngIf="!driver.editing" class="yellow-btn" (click)="edit(driver)">
          <mat-icon>create</mat-icon>
        </button>

        <button mat-icon-button *ngIf="!driver.editing" color="warn" (click)="deleteUser(driver)">
          <mat-icon>delete</mat-icon>
        </button>

        <button mat-icon-button *ngIf="driver.editing" color="primary" (click)="save(driver)">
          <mat-icon>save_alt</mat-icon>
        </button>

        <button mat-icon-button *ngIf="driver.editing" color="warn" (click)="cancelEdit(driver)">
          <mat-icon>cancel</mat-icon>
        </button>
      </div>

      <!-- CARD BODY -->
      <div class="card-body">
        <div class="view-mode">
          <h3 class="card-text truncate">Nombre: {{ driver.firstName }}</h3>
          <h3 class="card-text truncate">Apellido: {{ driver.lastName }}</h3>
          <h3 class="card-text truncate">Email: {{ driver.email }}</h3>
          <h3 class="card-text truncate">Teléfono: {{ driver.phone }}</h3>
          <h3 class="card-text truncate" *ngIf="!driver.editing">
            Provincia: {{ driver.province?.name || "No asignada" }}
          </h3>
        </div>

        <div *ngIf="driver.editing" class="edit-mode">
          <div class="form-group">
            <label>Provincia</label>
            <select class="form-control" [(ngModel)]="driver.editProvince">
              <option *ngFor="let p of provinces" [value]="p.id">
                {{ p.name }}
              </option>
            </select>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
