<div class="container mt-4">
  <form #signUpForm="ngForm" (ngSubmit)="signUp(signUpForm)">
    <div class="row">
      <!-- Nombre -->
      <div class="col-md-6 mb-3">
        <label>Nombre</label>
        <input
          type="text"
          class="form-control"
          name="firstName"
          ngModel
          required
          #firstNameInput="ngModel"
          [ngClass]="{ 'is-invalid': firstNameInput.invalid && firstNameInput.touched }"
        />
        <small *ngIf="firstNameInput.invalid && firstNameInput.touched" class="text-danger"> El nombre es requerido. </small>
      </div>

      <!-- Apellido -->
      <div class="col-md-6 mb-3">
        <label>Apellido</label>
        <input
          type="text"
          class="form-control"
          name="lastName"
          ngModel
          required
          #lastNameInput="ngModel"
          [ngClass]="{ 'is-invalid': lastNameInput.invalid && lastNameInput.touched }"
        />
        <small *ngIf="lastNameInput.invalid && lastNameInput.touched" class="text-danger"> El apellido es requerido. </small>
      </div>
    </div>

    <div class="row">
      <!-- Teléfono -->
      <div class="col-md-6 mb-3">
        <label>Teléfono</label>
        <input type="number" class="form-control" name="phone" ngModel required #phoneInput="ngModel" [ngClass]="{ 'is-invalid': phoneInput.invalid && phoneInput.touched }" />
        <small *ngIf="phoneInput.invalid && phoneInput.touched" class="text-danger"> El teléfono es requerido. </small>
      </div>

      <!-- Email -->
      <div class="col-md-6 mb-3">
        <label>Email</label>
        <input type="email" class="form-control" name="email" ngModel required email #emailInput="ngModel" [ngClass]="{ 'is-invalid': emailInput.invalid && emailInput.touched }" />
        <small *ngIf="emailInput.invalid && emailInput.touched" class="text-danger"> Ingrese un email válido. </small>
      </div>
    </div>

    <!-- Contraseña -->
    <div class="mb-3">
      <label>Contraseña</label>
      <div class="input-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          name="password"
          ngModel
          required
          pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*._-])[A-Za-z\d!@#$%^&*._-]{8,}$"
          #passwordInput="ngModel"
          [ngClass]="{ 'is-invalid': passwordInput.invalid && passwordInput.touched }"
        />
        <span class="input-group-text" (click)="togglePasswordVisibility()" style="cursor: pointer">
          <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </span>
      </div>
      <small *ngIf="passwordInput.invalid && passwordInput.touched" class="text-danger"> La contraseña debe tener 8 caracteres, una mayúscula, un número y un símbolo. </small>
    </div>

    <!-- Confirmar Password -->
    <div class="mb-3">
      <label>Confirmar Contraseña</label>
      <div class="input-group">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          class="form-control"
          name="password2"
          ngModel
          required
          #password2Input="ngModel"
          [ngClass]="{ 'is-invalid': password2Input.invalid && password2Input.touched }"
        />
        <span class="input-group-text" (click)="toggleConfirmPasswordVisibility()" style="cursor: pointer">
          <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </span>
      </div>
      <small *ngIf="password2Input.invalid && password2Input.touched" class="text-danger"> Debe verificar la contraseña. </small>
    </div>

    <!-- Provincia -->
    <div class="mb-3">
      <label>Provincia</label>
      <select class="form-control" name="province" [(ngModel)]="selectedProvince" required>
        <option value="">Seleccione una provincia</option>
        <option *ngFor="let province of provinces" [value]="province.id">{{ province.name }}</option>
      </select>
    </div>

    <!-- Botón -->
    <div class="d-flex justify-content-center">
      <button type="submit" class="btn btn-success" [disabled]="signUpForm.invalid">Crear Transportista</button>
    </div>
  </form>
</div>
