<!-- NAVBAR -->
<mat-toolbar class="navBar">
  <mat-toolbar-row>
    <a class="navbar-brand" routerLink="/about-us">P.A.CA.</a>

    <nav class="navbar navbar-expand-lg">
      <div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <button class="link" mat-button [matMenuTriggerFor]="categoriesMenu">Categorías</button>
              <mat-menu #categoriesMenu="matMenu">
                <button mat-menu-item *ngFor="let category of categories" (click)="onCategoryButtonClick(category.name)">
                  {{ category.name }}
                </button>
                <div class="empty-message" *ngIf="categories.length === 0">No hay categorías disponibles</div>
              </mat-menu>
            </li>

            <!-- <li class="nav-item">
              <button mat-button type="button" data-bs-toggle="modal" data-bs-target="#recargosModal">Recargos</button>
            </li> -->
          </ul>

          <form id="search-form" class="form-inline ml-auto" (submit)="onSearch($event)">
            <input class="form-control mr-sm-2" type="search" id="search-input" placeholder="Buqueda de productos..." aria-label="Search" />
            <button mat-icon-button type="submit" class="search-button" aria-label="Search">
              <span class="material-symbols-outlined icon search">search</span>
            </button>
          </form>
        </div>
      </div>
    </nav>

    <button *ngIf="!isLoggedIn" class="link" (click)="UserRegistration()" mat-button id="login">Iniciar Sesion</button>

    <button *ngIf="isLoggedIn" class="link" (click)="logout()" mat-button id="logout">Cerrar Sesion</button>

    <button *ngIf="isLoggedIn && isDriver" (click)="DeliveryReport()" mat-button>Reportes de entregas</button>

    <button mat-icon-button *ngIf="isLoggedIn && !isAdmin && !isDriver" (click)="UserInformation()" class="icon user" id="UserInformation">
      <mat-icon>perm_identity</mat-icon>
    </button>

    <button mat-icon-button *ngIf="isLoggedIn && !isAdmin && !isDriver" (click)="OrdersHistory()" class="icon history" matTooltip="Historial de pedidos">
      <mat-icon>history</mat-icon>
    </button>

    <button
      mat-icon-button
      color="accent"
      aria-label="Carrito"
      type="button"
      class="icon"
      data-bs-toggle="modal"
      data-bs-target="#cartModal"
      id="shopping_cart"
      *ngIf="!isAdmin && !isDriver"
      [matBadge]="cartCount"
      matBadgeColor="warn"
      matBadgePosition="above after"
      (click)="openCart()"
    >
      <mat-icon>shopping_cart</mat-icon>
    </button>

    <div>
      <button class="link" mat-button [matMenuTriggerFor]="menu" *ngIf="isAdmin" id="admin-button">Admin</button>
      <mat-menu #menu="matMenu">
        <button (click)="AdminProducts()" mat-menu-item>Productos</button>
        <button (click)="AdminProvinces()" mat-menu-item>Provincias</button>
        <button (click)="AdminCategories()" mat-menu-item>Categorias</button>
        <button (click)="AdminCities()" mat-menu-item>Ciudades</button>
        <button (click)="AdminSuppliers()" mat-menu-item>Proveedores</button>
        <button (click)="UserList()" mat-menu-item>Usuarios</button>
        <button (click)="OrderList()" mat-menu-item>Pedidos</button>
        <button (click)="Route()" mat-menu-item>Rutas</button>
        <button (click)="Dashboard()" mat-menu-item>Estadisticas</button>
      </mat-menu>
    </div>
  </mat-toolbar-row>
</mat-toolbar>

<!-- MODAL: Carrito -->
<div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="cartModalLabel">Carrito de compra</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <ng-container *ngIf="showCart">
        <app-cart [isModal]="true" [showConfirmButton]="false"></app-cart>
      </ng-container>

      <div class="modal-footer">
        <button class="btn back" data-bs-dismiss="modal" (click)="navigateToProducts()">Seguir comprando</button>
        <button routerLink="/cart" class="btn confirm" id="Finish" data-bs-dismiss="modal" (click)="finishOrder()">Terminar pedido</button>
      </div>
    </div>
  </div>
</div>
