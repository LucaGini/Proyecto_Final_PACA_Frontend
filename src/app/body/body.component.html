<!-- Contenedor de productos -->
<div *ngIf="products.length > 0" class="products-container">
  <button *ngIf="isSearching" class="back-btn" (click)="clearSearch()">← Ver todos</button>

  <div class="product-card" *ngFor="let product of products" [ngClass]="{ 'out-of-stock': product.stock === 0 }">
    <!-- Imagen -->
    <div class="image-wrapper">
      <a [routerLink]="['/product', product.id]">
        <img [src]="getImageUrl(product.image)" [alt]="product.name" />
        <span *ngIf="product.stock === 0" class="overlay-text">AGOTADO</span>
      </a>
    </div>

    <!-- Información -->
    <div class="card-body">
      <h2 class="card-title truncate title">{{ product.name }}</h2>
      <p class="card-text truncate description">{{ product.description }}</p>
      <p class="price">Precio: ${{ product.price }}</p>

      <!-- Botones -->
      <div class="button-container">
        <a [routerLink]="['/product', product.id]" class="btn info">Ver producto</a>

        <!-- Añadir -->
        <button *ngIf="!isInCart(product.id) && showAddButton()" class="btn add" (click)="addToCart(product)" [disabled]="product.stock === 0">Añadir al carrito</button>

        <!-- Quitar -->
        <button *ngIf="isInCart(product.id) && showAddButton()" class="btn remove" (click)="removeFromCart(product)">Quitar del carrito</button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="products.length === 0" class="no-items-message">
  <button *ngIf="isSearching" class="back-btn" (click)="clearSearch()">← Ver todos</button>

  <mat-icon>production_quantity_limits</mat-icon>
  <h3>No hay productos disponibles</h3>
  <p>
    {{ isSearching ? 'No hay productos que coincidan con el término ingresado.' : 'No hay productos registrados en el sistema en este momento.' }}
  </p>
</div>

<!-- Pagination Component (only for regular product browsing, not search) -->
<app-pagination
  *ngIf="pagination && !isSearching"
  [pagination]="pagination"
  [currentPage]="currentPage"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
>
</app-pagination>
