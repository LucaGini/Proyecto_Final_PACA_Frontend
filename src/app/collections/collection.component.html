<div *ngIf="products.length > 0" class="products-container">

  <!-- Cards -->
  <div
    class="product-card"
    *ngFor="let product of products"
    [ngClass]="{ 'out-of-stock': product.stock === 0 }"
  >

    <!-- Imagen -->
    <div class="image-wrapper">
      <img [src]="getImageUrl(product.image)" alt="{{ product.name }}">
      <span *ngIf="product.stock === 0" class="overlay-text">AGOTADO</span>
    </div>

    <!-- Contenido -->
    <div class="card-body">
      <h2 class="card-title truncate">{{ product.name }}</h2>
      <p class="card-text truncate">{{ product.description }}</p>
      <p class="price">Precio: ${{ product.price }}</p>

      <div class="button-container">
        <a [routerLink]="['/product', product.id]" class="btn info">
          Ver producto
        </a>

        <!-- Añadir -->
        <button *ngIf="!isInCart(product.id) && showAddButton()" class="btn add" (click)="addToCart(product)" [disabled]="product.stock === 0">Añadir al carrito</button>

        <!-- Quitar -->
        <button *ngIf="isInCart(product.id) && showAddButton()" class="btn remove" (click)="removeFromCart(product)">Quitar del carrito</button>
      </div>
    </div>

  </div>
</div>

<!-- Mensaje sin productos -->
<div *ngIf="products.length === 0" class="no-items-message">
  <mat-icon>inventory_2_off</mat-icon>
  <h3>No hay productos en esta categoría</h3>
  <p>La categoría "{{categoryName}}" no tiene productos disponibles en este momento.</p>
</div>

<!-- Pagination Component -->
<app-pagination
  *ngIf="pagination && products.length > 0"
  [pagination]="pagination"
  [currentPage]="currentPage"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)">
</app-pagination>
