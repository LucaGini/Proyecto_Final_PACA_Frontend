<div class="cart-container text-center">
  <div class="cart-items">
    <div class="cart-item" *ngFor="let item of items">
      <div class="card">
        <div class="item-image">
          <img class="card-img-top" [src]="getImageUrl(item.image)" alt="{{ item.name }}" />
        </div>

        <div class="item-info">
          <h1 class="card-title truncate">{{ item.name }}</h1>
          <h2 class="card-text">
            <span class="unit-label">P. Unit.</span>
            <span class="unit-value">{{ item.price | currency }}</span>
          </h2>
          <div class="quantity-control">
            <button type="button" class="btn-quantity" (click)="verifyStock(item, 'devolucion')">-</button>
            <span>{{ item.quantity }}</span>
            <button type="button" class="btn-quantity" (click)="verifyStock(item, 'compra')">+</button>
          </div>

          <button mat-icon-button class="btn-delete" (click)="removeItem(item)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="city-charge" *ngIf="cityCharge > 0">
    <h2>
      Recargo por domicilio seleccionado: <span>{{ cityCharge }}%</span>
    </h2>
  </div>

  <div class="total" *ngIf="totalAmount > 0">
    <h2>
      Total: <span>{{ totalAmount | currency }}</span>
    </h2>
  </div>

  <div *ngIf="items.length === 0" class="empty-cart-msg">
    <i class="material-icons">shopping_cart</i>
    Agrega productos al carrito para poder confirmar tu compra
  </div>

  <div class="btn-container">
    <button *ngIf="!isModal && showConfirmButton" class="btn back" (click)="navigateToProducts()">Seguir comprando</button>
    <button type="button" class="btn confirm" [disabled]="isCartEmpty" *ngIf="!isModal && showConfirmButton" (click)="confirmPurchase()">Confirmar compra</button>
  </div>
</div>
