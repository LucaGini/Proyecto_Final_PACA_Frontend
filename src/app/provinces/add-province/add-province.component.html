<form #addForm="ngForm" id="addForm" (ngSubmit)="add(addForm)">
  
  <div class="form-group">
    <label for="name">Provincia</label>

    <select class="form-control"
            id="name"
            name="name"
            ngModel
            required
            #nameInput="ngModel"
            [disabled]="availableProvinces.length === 0"
            [ngClass]="{ 'is-invalid': nameInput.invalid && nameInput.touched }">

      <option value="" disabled selected>Seleccione una provincia</option>
      <option *ngFor="let province of availableProvinces" [value]="province">
        {{ province }}
      </option>
    </select>

    <small *ngIf="nameInput.invalid && nameInput.touched" class="error-msg">
      Debe seleccionar una provincia.
    </small>

    <small *ngIf="availableProvinces.length === 0" class="text-info">
      Todas las provincias ya están registradas.
    </small>
  </div>

  <div class="d-flex justify-content-center mt-3">
    <button type="submit" class="btn btn-primary" [disabled]="addForm.invalid || availableProvinces.length === 0">
      Guardar
    </button>
  </div>

</form>
