<div class="provinces-container">
  <div class="province-card" *ngFor="let province of provinces">
    <div class="card">
      <!-- Acciones -->
      <div class="card-actions">
        <button mat-icon-button color="warn" (click)="delete(province.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>

      <!-- Contenido -->
      <div class="card-body">
          <h3 class="card-text">Nombre</h3>
          <p>{{ province.name }}</p>
        </div>
      </div>
    </div>
  </div>
